<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review | FreelanceHub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#005b7c", "surface-bright": "#f7f9fb", "primary-container": "#2563eb",
                    "on-surface-variant": "#434655", "primary": "#004ac6", "on-surface": "#191c1e",
                    "error-container": "#ffdad6", "on-error-container": "#93000a", "background": "#f7f9fb",
                    "secondary": "#565e74", "surface": "#f7f9fb", "on-primary": "#ffffff",
                    "surface-container-low": "#f2f4f6"
            },
            "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }
          },
        },
      }
    </script>
<style>
    body { font-family: 'Inter', sans-serif; background: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    .card { background: #fff; border-radius: 0.75rem; border: 1px solid #f1f1f3; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .star-btn { font-size: 32px; color: #d8dadc; cursor: pointer; transition: color 0.15s; }
    .star-btn.active, .star-btn:hover { color: #f5a623; }
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-gray-100 sticky top-0 z-20">
  <div class="max-w-2xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/dashboard" class="text-xl font-bold text-primary">FreelanceHub</a>
    <div class="flex items-center gap-4">
      <span id="userName" class="text-sm text-on-surface-variant hidden sm:inline"></span>
      <button id="logoutBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-100">Log Out</button>
    </div>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 py-8">
  <a id="backLink" href="/dashboard" class="text-sm text-primary font-medium mb-4 inline-flex items-center gap-1"><span class="material-symbols-outlined text-base">arrow_back</span> Back to Project</a>

  <div id="loading" class="text-sm text-on-surface-variant mt-4">Loading...</div>
  <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-lg bg-error-container text-on-error-container text-sm"></div>

  <!-- Existing review view -->
  <div id="existingReview" class="hidden card p-8">
    <h1 class="text-lg font-bold text-on-surface mb-4">Your Review</h1>
    <div id="existingStars" class="mb-3"></div>
    <p class="text-sm text-on-surface-variant" id="existingComment"></p>
  </div>

  <!-- Submit form -->
  <div id="submitCard" class="hidden card p-8">
    <h1 class="text-lg font-bold text-on-surface mb-1">Rate Your Freelancer</h1>
    <p class="text-sm text-on-surface-variant mb-6">Project: <span id="projectTitle" class="font-medium text-on-surface"></span></p>

    <form id="reviewForm">
      <label class="text-xs font-semibold text-secondary block mb-2">Rating</label>
      <div class="flex gap-1 mb-5" id="starRow">
        <span class="star-btn" data-value="1">★</span>
        <span class="star-btn" data-value="2">★</span>
        <span class="star-btn" data-value="3">★</span>
        <span class="star-btn" data-value="4">★</span>
        <span class="star-btn" data-value="5">★</span>
      </div>
      <input type="hidden" id="ratingInput" required/>

      <label class="text-xs font-semibold text-secondary block mb-2">Comment (optional)</label>
      <textarea id="commentInput" rows="4" class="w-full px-4 py-3 bg-surface-container-low border border-gray-200 rounded-lg text-sm outline-none focus:border-primary mb-5" placeholder="Share your experience..."></textarea>

      <button class="w-full py-3 bg-primary text-white rounded-lg font-semibold hover:bg-primary-container transition-colors" type="submit">Submit Review</button>
    </form>
  </div>

  <div id="notEligible" class="hidden card p-8 text-center text-on-surface-variant text-sm"></div>
</main>

<script>
const token = localStorage.getItem('access_token');
if (!token) window.location.href = '/login';

const pathParts = window.location.pathname.split('/').filter(Boolean);
const projectId = pathParts[1];
document.getElementById('backLink').href = '/projects/' + projectId;

let currentUser = null;
let selectedRating = 0;

async function api(path, options = {}) {
    const res = await fetch(path, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            ...(options.headers || {})
        }
    });
    const result = await res.json();
    if (!result.success && res.status === 401) {
        localStorage.clear();
        window.location.href = '/login';
        throw new Error('Unauthorized');
    }
    return { ok: result.success, status: res.status, result };
}

function starsHtml(n) {
    return Array.from({length: 5}, (_, i) => `<span class="star-btn ${i < n ? 'active' : ''}" style="cursor:default;">★</span>`).join('');
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

async function loadUser() {
    const { ok, result } = await api('/api/auth/me');
    if (!ok) return;
    currentUser = result.data.user;
    document.getElementById('userName').textContent = currentUser.name + ' (' + currentUser.role + ')';
}

document.querySelectorAll('.star-btn').forEach(star => {
    star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.value);
        document.getElementById('ratingInput').value = selectedRating;
        document.querySelectorAll('#starRow .star-btn').forEach(s => {
            s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
        });
    });
});

async function init() {
    await loadUser();

    // Does a review already exist for this project?
    const { ok: reviewOk, result: reviewResult, status: reviewStatus } = await api(`/api/reviews/project/${projectId}`);
    document.getElementById('loading').classList.add('hidden');

    if (reviewOk) {
        const review = reviewResult.data.review;
        document.getElementById('existingReview').classList.remove('hidden');
        document.getElementById('existingStars').innerHTML = starsHtml(review.rating);
        document.getElementById('existingComment').textContent = review.comment || '(no comment left)';
        return;
    }

    if (reviewStatus === 403) {
        document.getElementById('notEligible').textContent = "You don't have permission to view or leave a review for this project.";
        document.getElementById('notEligible').classList.remove('hidden');
        return;
    }

    // No review yet (404) — check whether this user can submit one
    const { ok: projOk, result: projResult } = await api(`/api/projects/${projectId}`);
    if (!projOk) {
        document.getElementById('errorBox').textContent = projResult.message || 'Could not load project.';
        document.getElementById('errorBox').classList.remove('hidden');
        return;
    }

    const project = projResult.data.project;
    const isOwner = currentUser && project.client_id === currentUser.id;

    if (!isOwner || currentUser.role !== 'client') {
        document.getElementById('notEligible').textContent = 'Only the client who posted this project can leave a review.';
        document.getElementById('notEligible').classList.remove('hidden');
        return;
    }
    if (project.status !== 'completed') {
        document.getElementById('notEligible').textContent = 'You can only review a project once it has been marked Completed.';
        document.getElementById('notEligible').classList.remove('hidden');
        return;
    }

    document.getElementById('projectTitle').textContent = project.title;
    document.getElementById('submitCard').classList.remove('hidden');
}

document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedRating) {
        alert('Please select a star rating.');
        return;
    }
    const { ok, result } = await api('/api/reviews', {
        method: 'POST',
        body: JSON.stringify({
            project_id: parseInt(projectId),
            rating: selectedRating,
            comment: document.getElementById('commentInput').value.trim() || undefined
        })
    });
    if (!ok) {
        alert(result.message || 'Could not submit review.');
        return;
    }
    window.location.href = '/projects/' + projectId;
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await api('/api/auth/logout', { method: 'POST' }); } finally {
        localStorage.clear();
        window.location.href = '/login';
    }
});

init();
</script>
</body>
</html>
