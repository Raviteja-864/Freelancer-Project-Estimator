<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | FreelanceHub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#005b7c", "surface-bright": "#f7f9fb", "on-primary-container": "#eeefff",
                    "surface-container-highest": "#e0e3e5", "outline": "#737686", "surface-container-low": "#f2f4f6",
                    "primary-container": "#2563eb", "on-tertiary": "#ffffff", "on-secondary-fixed-variant": "#3f465c",
                    "on-surface-variant": "#434655", "inverse-surface": "#2d3133", "primary": "#004ac6",
                    "on-surface": "#191c1e", "error-container": "#ffdad6", "on-error-container": "#93000a",
                    "inverse-on-surface": "#eff1f3", "secondary-fixed-dim": "#bec6e0", "on-secondary-container": "#5c647a",
                    "on-error": "#ffffff", "on-background": "#191c1e", "tertiary-fixed": "#c4e7ff",
                    "background": "#f7f9fb", "secondary": "#565e74", "surface-variant": "#e0e3e5",
                    "tertiary-container": "#00759f", "outline-variant": "#c3c6d7", "on-primary-fixed-variant": "#003ea8",
                    "surface": "#f7f9fb", "error": "#ba1a1a", "inverse-primary": "#b4c5ff",
                    "on-secondary-fixed": "#131b2e", "on-tertiary-container": "#e1f2ff", "surface-container": "#eceef0",
                    "on-tertiary-fixed-variant": "#004c69", "secondary-container": "#dae2fd", "secondary-fixed": "#dae2fd",
                    "surface-tint": "#0053db", "primary-fixed-dim": "#b4c5ff", "on-tertiary-fixed": "#001e2c",
                    "surface-dim": "#d8dadc", "on-primary": "#ffffff", "tertiary-fixed-dim": "#7bd0ff",
                    "surface-container-high": "#e6e8ea", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#00174b", "primary-fixed": "#dbe1ff"
            },
            "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
            "spacing": {
                    "stack-md": "16px", "container-max": "1440px", "gutter": "24px", "stack-sm": "8px",
                    "margin-mobile": "16px", "margin-desktop": "32px", "stack-lg": "32px", "sidebar-width": "280px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"], "display": ["Inter"], "headline-md": ["Inter"], "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "label-md": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f7f9fb 0%, #dbe1ff 100%); min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 74, 198, 0.08);
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .input-transition { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .role-btn.active { background-color: #004ac6; color: #ffffff; border-color: #004ac6; }
    </style>
</head>
<body class="flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden">
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/10 rounded-full blur-[120px] pointer-events-none"></div>
<main class="w-full max-w-[480px] z-10">
<div class="glass-card rounded-xl p-stack-lg md:p-12 transition-all duration-500">
<div class="flex flex-col items-center mb-stack-lg">
<img src="/static/img/logo.png" alt="FreelanceHub" class="w-16 h-16 mb-4 rounded-xl object-cover shadow-sm"/>
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-2">Create Your Account</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center">Join FreelanceHub as a client or a freelancer.</p>
</div>

<div class="hidden mb-4 px-4 py-3 rounded-lg bg-error-container text-on-error-container text-body-md" id="errorBanner"></div>

<form class="space-y-stack-md" id="registerForm">
<!-- Role toggle -->
<div class="space-y-2">
<label class="text-label-md font-label-md text-secondary">I want to</label>
<div class="grid grid-cols-2 gap-3">
<button class="role-btn active px-4 py-3 rounded-lg border border-outline-variant/30 bg-surface-container-lowest text-body-md font-body-md transition-colors" data-role="client" type="button">Hire Talent</button>
<button class="role-btn px-4 py-3 rounded-lg border border-outline-variant/30 bg-surface-container-lowest text-body-md font-body-md transition-colors" data-role="freelancer" type="button">Find Work</button>
</div>
<input id="role" type="hidden" value="client"/>
</div>

<div class="space-y-2">
<label class="text-label-md font-label-md text-secondary" for="name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/30 rounded-lg text-body-md font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none input-transition" id="name" placeholder="Jane Doe" required type="text"/>
</div>
</div>

<div class="space-y-2">
<label class="text-label-md font-label-md text-secondary" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/30 rounded-lg text-body-md font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none input-transition" id="email" placeholder="name@company.com" required type="email"/>
</div>
</div>

<div class="space-y-2">
<label class="text-label-md font-label-md text-secondary" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low border border-outline-variant/30 rounded-lg text-body-md font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none input-transition" id="password" placeholder="At least 6 characters, 1 letter + 1 number" required type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-secondary p-1" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>

<button class="w-full py-3 px-6 bg-primary text-on-primary font-headline-md text-headline-md rounded-lg shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-200 mt-4 flex items-center justify-center space-x-2" id="submitBtn" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>

<div class="mt-stack-lg text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Already have an account?
                    <a class="text-primary font-bold hover:underline" href="/login">Sign In</a>
</p>
</div>
</div>
</main>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        function showError(message) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = message;
            banner.classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('errorBanner').classList.add('hidden');
        }

        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard';
        }

        // Role toggle buttons
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('role').value = btn.dataset.role;
            });
        });

        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> <span>Creating account...</span>`;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const result = await res.json();

                if (!result.success) {
                    throw new Error(result.message || 'Registration failed');
                }

                localStorage.setItem('access_token', result.data.access_token);
                localStorage.setItem('refresh_token', result.data.refresh_token);
                localStorage.setItem('user', JSON.stringify(result.data.user));

                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> <span>Success</span>`;
                btn.classList.replace('bg-primary', 'bg-tertiary');

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 600);

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                showError(err.message);
            }
        });
    </script>
</body></html>
