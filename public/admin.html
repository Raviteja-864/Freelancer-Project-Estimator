<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin | FreelanceHub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#2563eb", "on-surface-variant": "#434655", "primary": "#004ac6",
                    "on-surface": "#191c1e", "error-container": "#ffdad6", "on-error-container": "#93000a",
                    "background": "#f7f9fb", "secondary": "#565e74", "surface": "#f7f9fb", "on-primary": "#ffffff",
                    "tertiary": "#005b7c"
            },
            "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }
          },
        },
      }
    </script>
<style>
    body { font-family: 'Inter', sans-serif; background: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    .card { background: #fff; border-radius: 0.75rem; border: 1px solid #f1f1f3; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 14px; font-weight: 600; color: #565e74; }
    .tab-btn.active { background: #004ac6; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 0.6rem 0.75rem; color: #565e74; font-weight: 600; border-bottom: 1px solid #f1f1f3; }
    td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f7f7f8; color: #191c1e; }
    .status-badge{display:inline-block;padding:0.2rem 0.65rem;border-radius:9999px;font-size:11px;font-weight:600;text-transform:capitalize;}
    .status-open,.status-active{background:#dbe1ff;color:#004ac6;}
    .status-in_progress,.status-pending{background:#fef3c7;color:#92400e;}
    .status-completed,.status-paid,.status-accepted{background:#dcfce7;color:#166534;}
    .status-cancelled,.status-suspended,.status-deleted,.status-withdrawn{background:#f3f4f6;color:#6b7280;}
    .status-rejected{background:#fee2e2;color:#991b1b;}
</style>
</head>
<body class="min-h-screen">

<header class="bg-white border-b border-gray-100 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="/dashboard" class="text-xl font-bold text-primary">FreelanceHub</a>
      <span class="text-sm font-semibold text-tertiary">Admin Panel</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="userName" class="text-sm text-on-surface-variant hidden sm:inline"></span>
      <button id="logoutBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-100">Log Out</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-8">
  <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-lg bg-error-container text-on-error-container text-sm"></div>

  <!-- Stats -->
  <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-4">
    <button class="tab-btn active" data-tab="users">Users</button>
    <button class="tab-btn" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="bids">Bids</button>
  </div>

  <div class="card p-4 overflow-x-auto">
    <div id="tab-users"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead><tbody id="usersBody"></tbody></table></div>
    <div id="tab-projects" class="hidden"><table><thead><tr><th>ID</th><th>Title</th><th>Client</th><th>Status</th><th>Bids</th><th>Created</th><th></th></tr></thead><tbody id="projectsBody"></tbody></table></div>
    <div id="tab-bids" class="hidden"><table><thead><tr><th>ID</th><th>Project</th><th>Freelancer</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody id="bidsBody"></tbody></table></div>
  </div>
</main>

<script>
const token = localStorage.getItem('access_token');
if (!token) window.location.href = '/login';

async function api(path, options = {}) {
    const res = await fetch(path, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            ...(options.headers || {})
        }
    });
    const result = await res.json();
    if (!result.success && res.status === 401) {
        localStorage.clear();
        window.location.href = '/login';
        throw new Error('Unauthorized');
    }
    return { ok: result.success, status: res.status, result };
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

async function loadUser() {
    const { ok, result } = await api('/api/auth/me');
    if (!ok) return;
    const user = result.data.user;
    document.getElementById('userName').textContent = user.name + ' (admin)';
    if (user.role !== 'admin') {
        window.location.href = '/dashboard';
    }
}

async function loadStats() {
    const { ok, result } = await api('/api/admin/dashboard');
    if (!ok) {
        document.getElementById('errorBox').textContent = result.message || 'Could not load dashboard.';
        document.getElementById('errorBox').classList.remove('hidden');
        return;
    }
    const s = result.data.stats;
    const cards = [
        ['Total Users', s.total_users, 'group'],
        ['Total Projects', s.total_projects, 'work'],
        ['Total Bids', s.total_bids, 'gavel'],
        ['Total Paid', '$' + s.total_paid_amount, 'payments'],
        ['Total Reviews', s.total_reviews, 'star'],
        ['Avg Rating', s.average_rating != null ? s.average_rating.toFixed(2) : '—', 'star_half'],
    ];
    document.getElementById('statsGrid').innerHTML = cards.map(([label, value, icon]) => `
        <div class="card p-4">
            <span class="material-symbols-outlined text-primary text-2xl">${icon}</span>
            <p class="text-2xl font-bold text-on-surface mt-1">${value}</p>
            <p class="text-xs text-on-surface-variant">${label}</p>
        </div>`).join('');
}

async function loadUsers() {
    const { ok, result } = await api('/api/admin/users?per_page=50');
    if (!ok) return;
    document.getElementById('usersBody').innerHTML = result.data.users.map(u => `
        <tr>
            <td>${u.id}</td>
            <td>${escapeHtml(u.name)}</td>
            <td>${escapeHtml(u.email)}</td>
            <td class="capitalize">${u.role}</td>
            <td><span class="status-badge status-${u.account_status}">${u.account_status}</span></td>
            <td>${u.created_at ? u.created_at.split('T')[0] : ''}</td>
            <td class="whitespace-nowrap">
                ${u.account_status !== 'suspended' ? `<button class="suspend-btn text-xs text-tertiary font-semibold hover:underline mr-3" data-id="${u.id}">Suspend</button>` : `<button class="activate-btn text-xs text-primary font-semibold hover:underline mr-3" data-id="${u.id}">Reactivate</button>`}
                <button class="delete-user-btn text-xs text-red-600 font-semibold hover:underline" data-id="${u.id}">Delete</button>
            </td>
        </tr>`).join('');

    document.querySelectorAll('.suspend-btn').forEach(b => b.addEventListener('click', () => updateUserStatus(b.dataset.id, 'suspended')));
    document.querySelectorAll('.activate-btn').forEach(b => b.addEventListener('click', () => updateUserStatus(b.dataset.id, 'active')));
    document.querySelectorAll('.delete-user-btn').forEach(b => b.addEventListener('click', () => deleteUser(b.dataset.id)));
}

async function updateUserStatus(userId, status) {
    const { ok, result } = await api(`/api/admin/users/${userId}/status`, { method: 'PATCH', body: JSON.stringify({ account_status: status }) });
    if (!ok) { alert(result.message || 'Could not update user.'); return; }
    await loadUsers();
}

async function deleteUser(userId) {
    if (!confirm('Permanently delete this user? This cannot be undone.')) return;
    const { ok, result } = await api(`/api/admin/users/${userId}`, { method: 'DELETE' });
    if (!ok) { alert(result.message || 'Could not delete user.'); return; }
    await loadUsers();
}

async function loadProjects() {
    const { ok, result } = await api('/api/admin/projects?per_page=50');
    if (!ok) return;
    document.getElementById('projectsBody').innerHTML = result.data.projects.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${escapeHtml(p.title)}</td>
            <td>${escapeHtml(p.client_name || '')}</td>
            <td><span class="status-badge status-${p.status}">${p.status.replace('_',' ')}</span></td>
            <td>${p.bid_count}</td>
            <td>${p.created_at ? p.created_at.split('T')[0] : ''}</td>
            <td><button class="delete-project-btn text-xs text-red-600 font-semibold hover:underline" data-id="${p.id}">Delete</button></td>
        </tr>`).join('');

    document.querySelectorAll('.delete-project-btn').forEach(b => b.addEventListener('click', () => deleteProject(b.dataset.id)));
}

async function deleteProject(projectId) {
    if (!confirm('Force-delete this project? This cannot be undone.')) return;
    const { ok, result } = await api(`/api/admin/projects/${projectId}`, { method: 'DELETE' });
    if (!ok) { alert(result.message || 'Could not delete project.'); return; }
    await loadProjects();
}

async function loadBids() {
    const { ok, result } = await api('/api/admin/bids?per_page=50');
    if (!ok) return;
    document.getElementById('bidsBody').innerHTML = result.data.bids.map(b => `
        <tr>
            <td>${b.id}</td>
            <td>#${b.project_id}</td>
            <td>${escapeHtml(b.freelancer_name || '')}</td>
            <td>$${b.price}</td>
            <td><span class="status-badge status-${b.status}">${b.status}</span></td>
            <td><button class="delete-bid-btn text-xs text-red-600 font-semibold hover:underline" data-id="${b.id}">Delete</button></td>
        </tr>`).join('');

    document.querySelectorAll('.delete-bid-btn').forEach(b => b.addEventListener('click', () => deleteBid(b.dataset.id)));
}

async function deleteBid(bidId) {
    if (!confirm('Force-delete this bid? This cannot be undone.')) return;
    const { ok, result } = await api(`/api/admin/bids/${bidId}`, { method: 'DELETE' });
    if (!ok) { alert(result.message || 'Could not delete bid.'); return; }
    await loadBids();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['users', 'projects', 'bids'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
        });
    });
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await api('/api/auth/logout', { method: 'POST' }); } finally {
        localStorage.clear();
        window.location.href = '/login';
    }
});

(async function init() {
    await loadUser();
    await loadStats();
    await loadUsers();
    await loadProjects();
    await loadBids();
})();
</script>
</body>
</html>
