[build]
  publish = "public"

[[redirects]]
  from = "/find-work"
  to = "/find_work.html"
  status = 200

[[redirects]]
  from = "/projects/new"
  to = "/new_project.html"
  status = 200

[[redirects]]
  from = "/projects/*"
  to = "/project_detail.html"
  status = 200

[[redirects]]
  from = "/messages/*"
  to = "/messages.html"
  status = 200

[[redirects]]
  from = "/payments/*"
  to = "/payment.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
